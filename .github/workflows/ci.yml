name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dan Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ambil kode
        uses: actions/checkout@v7.0.1
      - name: Siapkan JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build dan test dengan H2
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Startup dan login demo dari JAR runtime
        run: python3 scripts/smoke_demo.py target/apotek-0.0.1-SNAPSHOT.jar
