name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dan Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: apotek_test
          MYSQL_USER: apotek_test
          MYSQL_PASSWORD: test_only_password
          MYSQL_ROOT_PASSWORD: test_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Ambil kode
        uses: actions/checkout@v7.0.1
      - name: Siapkan JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build dan test dengan H2
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Test dengan MySQL 8.4
        run: ./mvnw --batch-mode --no-transfer-progress test
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/apotek_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Jakarta
          TEST_DB_USERNAME: apotek_test
          TEST_DB_PASSWORD: test_only_password
