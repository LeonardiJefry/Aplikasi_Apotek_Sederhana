# Demo lokal tanpa server database atau .env. Data hilang saat JVM berhenti.
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:klinik-demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.placeholders.tableOptions=
spring.h2.console.enabled=false
klinik.demo.enabled=true
# Password sintetis untuk demo lokal, bukan kredensial pribadi.
klinik.demo.password=${DEMO_LOCAL_PASSWORD:demo-klinik-2026}
