spring.application.name=apotek
spring.config.import=optional:file:.env[.properties]
server.port=${APP_PORT:8080}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:apotek}?serverTimezone=Asia/Jakarta&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:apotek}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.include-message=never
