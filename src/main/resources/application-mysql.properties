# Profil opsional historis. Tidak diperlukan untuk SETUP-00 sampai QA-01.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:apotek}?connectionTimeZone=Asia/Jakarta&characterEncoding=UTF-8&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&sslMode=${DB_SSL_MODE:PREFERRED}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:apotek}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.placeholders.tableOptions=ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci
klinik.demo.enabled=${DEMO_ENABLED:false}
klinik.demo.password=${DEMO_PASSWORD:}
