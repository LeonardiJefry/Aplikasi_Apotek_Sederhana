<!doctype html><html lang="id" xmlns:th="http://www.thymeleaf.org"><body>
<nav th:fragment="menu" class="sidebar" aria-label="Menu utama"><p class="eyebrow">PELAYANAN LOKET</p><a class="schedule-nav" th:href="@{/}">Beranda</a><a class="nav-active" th:href="@{/loket/pasien}" aria-current="page">Data pasien</a><a class="schedule-nav" th:href="@{/loket/panggilan}">Panggilan antrean</a><a class="schedule-nav" th:href="@{/loket/check-in}">Peringatan check-in</a></nav>
<th:block th:fragment="riwayat(rows,judul,detail,kunjungan)"><h2><span th:text="${judul}"></span> <span class="badge" th:text="${rows.totalElements}"></span></h2>
<p class="help" th:text="${kunjungan ? 'Kunjungan operasional dari antrean berstatus Selesai; tidak memuat rekam medis atau diagnosis.' : 'Seluruh status pendaftaran pasien terpilih, terbaru lebih dahulu.'}"></p>
<p th:if="${rows.isEmpty()}" class="muted">Belum ada riwayat pada halaman ini.</p>
<table th:unless="${rows.isEmpty()}" class="pasien-history"><thead><tr><th>Tanggal layanan</th><th>Layanan / dokter</th><th>Status / waktu</th></tr></thead><tbody><tr th:each="r : ${rows.content}"><td data-label="Tanggal layanan" th:text="${r.tanggalLayanan}"></td><td data-label="Layanan / dokter"><strong th:text="${r.layanan}"></strong><small th:text="${r.dokter}"></small><small th:text="${'Nomor ' + r.nomorAntrean + ' · ' + r.idAntrean}"></small></td><td data-label="Status / waktu"><span class="badge" th:text="${r.status}"></span><small th:text="${kunjungan ? 'Selesai: ' + (r.waktuSelesai != null ? r.waktuSelesai : 'Belum tercatat') : 'Booking: ' + r.waktuBooking}"></small></td></tr></tbody></table>
<nav class="pasien-pagination" th:attr="aria-label=${judul}"><a class="button outline" th:if="${rows.hasPrevious()}" th:href="@{/loket/pasien/{id}(id=${detail.pasien.idPasien},halamanPendaftaran=${kunjungan ? detail.pendaftaran.number : rows.number - 1},halamanKunjungan=${kunjungan ? rows.number - 1 : detail.kunjungan.number})}">Sebelumnya</a><span class="help" th:text="${'Halaman ' + (rows.number + 1)}"></span><a class="button outline" th:if="${rows.hasNext()}" th:href="@{/loket/pasien/{id}(id=${detail.pasien.idPasien},halamanPendaftaran=${kunjungan ? detail.pendaftaran.number : rows.number + 1},halamanKunjungan=${kunjungan ? rows.number + 1 : detail.kunjungan.number})}">Berikutnya</a></nav></th:block>
</body></html>
