# DB-01: PostgreSQL Supabase. Nilai rahasia dibaca dari environment atau .env lokal, tidak pernah dari repo.
# Gunakan Session pooler Supabase (port 5432, mendukung prepared statement dan kunci transaksi) atau koneksi langsung.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=${SUPABASE_DB_SSLMODE:require}&currentSchema=${SUPABASE_DB_SCHEMA:klinik}&ApplicationName=klinik-leonardo
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
# Batas koneksi kecil agar sesuai kuota pooler paket gratis Supabase.
spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
# Skema non-publik: tidak diekspos Supabase Data API. Migrasi MySQL historis tetap di db/migration.
spring.flyway.locations=classpath:db/migration-postgresql
spring.flyway.schemas=${SUPABASE_DB_SCHEMA:klinik}
spring.flyway.default-schema=${SUPABASE_DB_SCHEMA:klinik}
spring.flyway.create-schemas=true
spring.jpa.properties.hibernate.default_schema=${SUPABASE_DB_SCHEMA:klinik}
# Seed sintetis hanya bila diminta; tidak pernah aktif otomatis pada database bersama.
klinik.demo.enabled=${DEMO_ENABLED:false}
klinik.demo.password=${DEMO_PASSWORD:}
